name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # 20 contract tests + 2 demo-story tests
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: site, path: docs, retention-days: 7 }

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright-core install-deps chromium && npx e2e-web install chromium
      # Deterministic tests only unless AI_GATEWAY_API_KEY is configured as a repository secret.
      - working-directory: e2e
        run: npx e2e run
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          E2E_TELEMETRY_DISABLED: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: e2e/.e2e, retention-days: 7 }
