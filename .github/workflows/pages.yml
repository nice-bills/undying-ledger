# Keeps the gh-pages branch equal to docs/ (the built demo, relative paths) on every push to main.
# GitHub Pages serves the gh-pages branch: https://nice-bills.github.io/undying-ledger/
name: pages
on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push docs/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA=$(git subtree split --prefix docs HEAD)
          git push --force origin "$SHA:refs/heads/gh-pages"
