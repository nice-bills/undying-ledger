# Proof server for Preprod / local proving. From midnightntwrk/example-private-party compose.yml (Apache-2.0).
services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
